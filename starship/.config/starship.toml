scan_timeout = 45

format = """
$directory\
$git_branch\
$git_status\
$rust\
$c\
$zig\
$golang\
$line_break\
$character\
"""
[username]
show_always = true
style_root = "189"
style_user = "75"
format = "[$user]($style)"
aliases = { "hunte" = "hunter" }

[directory]
truncation_length = 5
truncation_symbol = '…/'
disabled = false
style = "75"
read_only = ' '
read_only_style = 'red'
use_os_path_sep = false

[cmd_duration]
min_time = 2_000
show_milliseconds = false
format = ' [ $duration]($style) '
style = '238'
disabled = false
show_notifications = false
min_time_to_notify = 45_000

[character]
success_symbol = "[❯](189)"
error_symbol = "[❯](179)"

[c]
symbol = " "

[git_branch]
symbol = " "

[git_commit]
tag_symbol = '  '

[hostname]
ssh_symbol = " "

[package]
symbol = "󰏗 "

[rust]
symbol = "󱘗 "

[sudo]
symbol = " "
style = "bold blue"
disabled = false
